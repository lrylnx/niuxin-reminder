name: macOS build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test.sh
      # The stable local signing key stays in the owner's login keychain.
      # CI validates code only; deliverable apps must use scripts/build.sh locally.
      - run: xcrun swiftc -typecheck main.swift EventParser.swift PendingReminders.swift -framework AppKit
